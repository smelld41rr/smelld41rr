name: Generate Matrix Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: danishcodepy
          outputs: |
            dist/github-snake.svg?palette=github-dark
            dist/github-snake-dark.svg?palette=github-dark
            dist/github-snake-matrix.svg?color_snake=#00ff00&color_dots=#003300,#006600,#00ff00

      - name: Push Snake
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Matrix Snake"
